AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless Events Observability — a central EventBridge bus, an error-alert
  digest (SQS -> SNS, throttled to one email per minute), and an EventBridge ->
  OpenSearch forwarder that indexes every platform event for search and
  analytics. Deploys entirely into your own AWS account.

Metadata:
  AWS::ServerlessRepo::Application:
    # A new application from the release after 1.5.0. SAR names are immutable, so
    # renaming means publishing under a new name: the first `sam publish` of it
    # creates the application, once per region. The previous one,
    # serverless-events-observability, stays published and frozen at 1.4.0.
    # SAR keeps the case, so the ARN ends in exactly this string.
    Name: AWS-EventBridge-Firehose-OpenSearch-Forwarder
    # SAR caps this at 256 characters, counted after YAML folds the block into
    # one line. `sam publish` rejects a longer one outright -- and does so after
    # build and package, so an over-long description costs a full CI run.
    Description: >
      Drop-in event observability for EventBridge: throttled error-alert digests
      and an OpenSearch forwarder that indexes every event, per-event or batched
      through Firehose. The document shape is configuration, so one artifact
      serves every tenant.
    Author: JunctionNet
    SpdxLicenseId: Apache-2.0
    LicenseUrl: LICENSE.txt
    ReadmeUrl: README.md
    Labels: ['eventbridge', 'observability', 'opensearch', 'firehose', 'serverless', 'events']
    # This repository, which is the product's source. These two links are the
    # only thing a SAR reader can follow, so they must point somewhere every
    # reader can open.
    HomePageUrl: https://github.com/jnet-platform-factory/aws-eventbridge-firehose-opensearch-forwarder
    # 1.0.0-1.0.3 already exist, published 2026-07-05 from
    # platform-factory/events-observability -- the Lambda-only original this
    # descends from. A published SemanticVersion is immutable, so republishing
    # 1.0.0 fails outright. Minor, not major: every new parameter
    # (ShapingConfig, CreateForwardingRule, EventBusName) defaults to the old
    # behaviour, and nothing was removed.
    # 1.4.0: DigestReservedConcurrency, so the stack can deploy in a Region
    # whose Lambda concurrency limit is too small to reserve any.
    # 1.5.0: CreateErrorAlerting, so a tenant who reads errors elsewhere can
    # leave the whole digest pipeline out. Defaults to 'true', which resolves to
    # exactly the 1.4.0 resources.
    SemanticVersion: 1.6.0
    SourceCodeUrl: https://github.com/jnet-platform-factory/aws-eventbridge-firehose-opensearch-forwarder

Parameters:
  NamePrefix:
    Type: String
    Default: events-observability
    Description: >
      Prefix applied to all created resource names so multiple deployments (or
      other stacks) never collide. Use lowercase letters, numbers, and hyphens.
    AllowedPattern: '^[a-z0-9-]+$'

  EnvironmentName:
    Type: String
    Default: prod
    Description: Environment name (e.g. dev, staging, prod). Used in resource names and alert subjects.
    AllowedPattern: '^[a-z0-9-]+$'

  OpenSearchEndpoint:
    Type: String
    Description: >
      Your OpenSearch endpoint (managed domain or Serverless collection), e.g.
      search-my-domain-xxxx.us-east-1.es.amazonaws.com. The forwarder indexes
      events here. Bring your own — this template does not provision OpenSearch.

  OpenSearchResourceArn:
    Type: String
    Description: >
      ARN used to scope the forwarder's IAM permissions. For a managed domain:
      arn:aws:es:REGION:ACCOUNT:domain/NAME/*. For Serverless:
      arn:aws:aoss:REGION:ACCOUNT:collection/COLLECTION_ID.

  OpenSearchServiceName:
    Type: String
    Default: es
    AllowedValues: [es, aoss]
    Description: >
      SigV4 signing service. "es" for a managed OpenSearch/Elasticsearch domain,
      "aoss" for an OpenSearch Serverless collection.

  OpenSearchRegion:
    Type: String
    Default: ''
    Description: >
      Region to sign OpenSearch requests for. Leave blank to use the region this
      stack is deployed in. Set this if your OpenSearch endpoint lives in a
      different region than this stack.

  OpenSearchIndex:
    Type: String
    Description: OpenSearch index name events are written to (auto-created on first write).
    AllowedPattern: '^[a-z0-9][a-z0-9._-]*$'

  CreateErrorAlerting:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether this stack creates the error-alert digest: the rule matching
      Error, ProcessingError and IntegrationError events, the queue and
      dead-letter queue behind it, the digest function and the alerts SNS topic.

      "true" (default): all of it is created, exactly as in earlier versions.

      "false": none of it is. Use this when errors are already read somewhere
      else — in OpenSearch, where the forwarder indexes them like every other
      event, or through a rule of your own — and a digest email would only be a
      second, noisier copy. AlertEmail and DigestReservedConcurrency are then
      ignored, and the AlertsSnsTopicArn and ErrorAlertsQueueArn outputs are not
      created.

      Error events are still forwarded either way; this removes the digest, not
      the events. The bus, forwarder and Firehose alarms are still created,
      because they watch the delivery path rather than your events, but with no
      actions: they change state in CloudWatch and notify nobody.

  AlertEmail:
    Type: String
    Default: ''
    Description: >
      Optional. An email address to subscribe to the alerts SNS topic. Leave
      blank to wire up subscriptions yourself after deployment. Ignored when
      CreateErrorAlerting is "false", since there is then no topic.

  EventBusName:
    Type: String
    Default: ''
    Description: >
      The EventBridge bus this pipeline listens on.

      Leave blank and the stack creates one named
      `<NamePrefix>-events-<EnvironmentName>` and owns it. Right for a new
      deployment — publish your events there and everything else follows.

      Set it to an existing bus name and the stack attaches to that bus and
      creates nothing. Use this when the bus is owned elsewhere: by Terraform, by
      another CloudFormation stack, or by a platform team. Two IaC tools owning
      one bus is the failure this avoids — a rollback or a stack delete would
      otherwise destroy a resource the other tool believes it manages.

      "default" is a valid value, but a dedicated bus is worth having: rules on
      the default bus compete with every AWS service event in the account.

  DigestReservedConcurrency:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 100
    Description: >
      Reserved concurrency for the alert-digest function. With the 60-second
      batch window, 1 is what caps alerts at roughly one email per minute — the
      whole point of the digest.

      Set it to **0 to not reserve any**, which is not "no concurrency" but "do
      not carve a slice out of the account pool". You need that in a Region whose
      Lambda concurrency limit is small: reserving even 1 is refused when it would
      drop unreserved concurrency below 10, and an unactivated Region defaults to
      a limit of 10, so the reservation fails outright. A tenant hit exactly this
      — limit 10 in a Region they do not run in, against 1000 in the one they do.

      Without a reservation the digest can run concurrently and the throttling
      guarantee weakens: you may get more than one email per minute during a
      storm. Raise the Region's limit and set this back to 1 if that matters.

      Ignored when CreateErrorAlerting is "false", since there is then no digest.

  ForwarderRoleName:
    Type: String
    Default: ''
    Description: >
      Pin the forwarder's execution role to a fixed name instead of letting
      CloudFormation generate one.

      Leave blank and SAM names the role, which is fine when the domain is in
      this account. Set it when the role's ARN is written into an access policy
      **somewhere else** — a cross-account OpenSearch domain names principals
      exactly, so a generated name means every replacement of the function
      silently invalidates the grant and every document starts 403ing with no
      code change to blame.

      It is also how an existing deployment migrates onto this product without
      touching the grant at all: reuse the name the old stack used. Note that
      two stacks cannot hold the same role name at once, so the old one has to
      release it first.

  CreateSearchApi:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Whether to create an HTTP API for searching the archive.

      "false" (default): this stack forwards events and nothing else. No API
      gateway, no second Lambda, no extra IAM role — a tenant who only wants
      events indexed pays nothing for a query surface they will not call.

      "true": creates an HTTP API with GET /search, /facets, /{event_id} and
      /openapi.json over the same index the forwarder writes to. The gateway is
      created with no custom domain; take the SearchApiEndpoint output and map
      it yourself, because a domain is yours and this stack should not own DNS.

      **The API is unauthenticated unless you set SearchApiAuthorizerArn.** The
      archive holds every event on the bus, which is usually more than you want
      world-readable.

  SearchApiAuthorizerArn:
    Type: String
    Default: ''
    Description: >
      Search API only. A Lambda authorizer to put in front of every route except
      /openapi.json. Leave blank and the API is open to anyone who can reach the
      endpoint.

      The function must already exist and must allow invocation by API Gateway;
      this stack adds the permission for its own API. Identity source is the
      Authorization header, with simple responses (the authorizer returns
      {"isAuthorized": true|false}).

  EnableEmitEndpoint:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      Search API only. Adds POST /emit, which publishes an event to the bus on
      the caller's behalf — for clients that cannot reach EventBridge directly.

      Off by default because it is the one route that writes. An authenticated
      event-injection endpoint is a reasonable thing to want and a poor thing to
      enable without deciding to.

  ShapingConfig:
    Type: String
    Default: ''
    MaxLength: 4000
    Description: >
      The tenant field map: how an EventBridge `detail` becomes an OpenSearch
      document. JSON, minified. Leave blank for the generic shape — source,
      detail-type, the whole detail as `payload`, and the four core fields
      environment / application / organization / username with default fallbacks.

      Three optional keys:

        defaults  per-core-field fallback, used when the detail omits the key or
                  carries an empty value.
        promote   lift a top-level detail key out as its own document field, so
                  it can be aggregated. `payload` is stored as a JSON *string*,
                  so nothing inside it can be summed or filtered on — a promotion
                  is the only way to make a value queryable. Each entry is
                  {"from": ..., "as": ..., "type": "int"|"str"|"raw"}.
        nested    build a composite object from already-resolved core fields.

      Example:

        {"defaults":{"application":"MyApp"},
         "promote":[{"from":"num_pages","as":"num_pages","type":"int"}]}

      **Choose `type` deliberately, and prefer int or str over raw.** An index
      with no explicit mapping takes each field's type from the first non-null
      value it ever sees, permanently. An emitter that sends "12" where it once
      sent 12 will map the field as text and break every aggregation over it,
      fixable only by a reindex — and because indexing errors are swallowed, it
      breaks silently, discarding whole documents. The coercers exist to stop an
      emitter deciding your mapping by accident.

      Anything this parameter cannot honour exactly fails the cold start with a
      named error rather than quietly shaping a different document.

  CreateForwardingRule:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Whether this stack creates the EventBridge rule that feeds the forwarder.

      "true" (default): a rule matching every event in this account on the bus is
      created for you. Right for a new deployment.

      "false": the stack creates the forwarder, the stream, the alarms and the
      roles, but no rule — you point your own rule at the `ForwarderFunctionArn`
      or `DeliveryStreamArn` output. Use this when the filtering is yours: a
      source allowlist, a detail-type filter, or a rule that already exists in
      another stack and must keep its name. Filtering at the rule is also the
      cheapest place to do it, since an event that never matches is never
      delivered and never billed.

      Set it false and forget the rule and nothing is forwarded. Set it true
      alongside an existing rule and every event is indexed twice.

  DeliveryMode:
    Type: String
    Default: Firehose
    AllowedValues: [Lambda, Firehose]
    Description: >
      How events get from the bus into OpenSearch.

      "Firehose" (default): the rule targets an Amazon Data Firehose stream.
      Firehose buffers records, invokes the forwarder as a data *transformation*
      (a batch of raw EventBridge envelopes in, shaped documents out), then
      bulk-indexes the result. Firehose owns buffering, bulk delivery, retry and
      backup of failed documents to S3. Costs an S3 bucket, a stream and two IAM
      roles.

      "Lambda": an EventBridge rule invokes the forwarder once per event and the
      function indexes that one document itself. No extra infrastructure, but it
      is one invocation and one single-document index call per event, and retry
      / failure handling is whatever the function implements.

      **The default changed from "Lambda" to "Firehose" in the release after
      1.5.0.** A stack that never set this parameter switches mode on its next
      update. To keep the per-event path, set "Lambda" explicitly.

      Two cases where the default does not deploy as it stands:

        - A domain whose access policy names its principals (every cross-account
          domain does): Firehose checks at CreateDeliveryStream that its delivery
          role can reach the domain, and that role does not exist until this
          stack creates it. Deploy with FirehoseStreamEnabled=false first; see
          that parameter.
        - OpenSearch Serverless (OpenSearchServiceName=aoss): Firehose reaches a
          collection through a different destination block that is not wired up
          here. Set "Lambda".

  FirehoseBufferSizeMBs:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100
    Description: >
      Firehose mode only. Buffer this many MB of records before bulk-indexing.
      Whichever of size/interval is reached first wins. AWS suggests roughly ten
      seconds' worth of ingest.

  FirehoseBufferIntervalSeconds:
    Type: Number
    Default: 60
    MinValue: 0
    MaxValue: 900
    Description: >
      Firehose mode only. Flush after this many seconds even if
      FirehoseBufferSizeMBs has not been reached. Raise it to batch harder,
      lower it to see events sooner.

      Applied to BOTH of the stream's buffers, which sit in series: the
      processing buffer that accumulates records before the transform runs, and
      the delivery buffer that accumulates shaped documents before the bulk
      write. So worst-case time from put_events to a searchable document is
      about TWICE this value, not one times it. Setting only the delivery
      buffer — the more obvious half — buys half the improvement, because
      records still wait out the processing buffer first.

  FirehoseIndexRotationPeriod:
    Type: String
    Default: NoRotation
    AllowedValues: [NoRotation, OneHour, OneDay, OneWeek, OneMonth]
    Description: >
      Firehose mode only. Appending a period to the index name is how you expire
      old data without a delete-by-query. Defaults to NoRotation because that is
      what the Lambda path did: rotation changes the index name (index-YYYY-MM-DD),
      so anything querying the bare OpenSearchIndex name needs a wildcard first.

  FirehoseStreamEnabled:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      Firehose mode only, and the answer to a chicken-and-egg problem: Firehose
      verifies that its delivery role can actually reach the cluster at
      CreateDeliveryStream time, and refuses with "Verify that the IAM role has
      access to the Elasticsearch cluster endpoint" otherwise. But the role it
      needs granted is created by this very stack, and OpenSearch will not
      accept a principal ARN that does not exist yet. One deploy cannot do both.

      So if the domain has a restrictive access policy — which every
      cross-account domain does — deploy twice:

        1. FirehoseStreamEnabled=false. Creates the delivery role, the
           failed-document bucket and the log group, and nothing that talks to
           OpenSearch. Take FirehoseDeliveryRoleArn from the outputs and add it
           to the domain's access policy.
        2. FirehoseStreamEnabled=true (the default). Creates the stream and
           switches the rule over to it.

      Leave it at true when the delivery role can already reach the domain — a
      same-account domain with a permissive policy, or a repeat deploy.

  FailedDocumentRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    Description: >
      Firehose mode only. Days to keep documents in the failed-document S3
      bucket before lifecycle expiry. These are events OpenSearch rejected, kept
      so they can be inspected and replayed.

Conditions:
  IsManagedDomain: !Equals [!Ref OpenSearchServiceName, 'es']
  HasRegionOverride: !Not [!Equals [!Ref OpenSearchRegion, '']]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, '']]
  # The whole error-alert digest, and every reference to any part of it, is
  # gated on this, so "false" leaves nothing pointing at a resource that does
  # not exist. tests/test_template.py holds the template to that.
  CreateErrorAlertingResources: !Equals [!Ref CreateErrorAlerting, 'true']
  # An AlertEmail with no topic to subscribe it to is ignored, not an error.
  CreateAlertEmailSubscription: !And
    - !Condition HasAlertEmail
    - !Condition CreateErrorAlertingResources
  IsFirehoseDelivery: !Equals [!Ref DeliveryMode, 'Firehose']
  CreateEventBus: !Equals [!Ref EventBusName, '']
  HasForwarderRoleName: !Not [!Equals [!Ref ForwarderRoleName, '']]
  ReserveDigestConcurrency: !Not [!Equals [!Ref DigestReservedConcurrency, 0]]
  CreateSearchApiResources: !Equals [!Ref CreateSearchApi, 'true']
  IsEmitEnabled: !Equals [!Ref EnableEmitEndpoint, 'true']
  HasSearchApiAuthorizer: !And
    - !Equals [!Ref CreateSearchApi, 'true']
    - !Not [!Equals [!Ref SearchApiAuthorizerArn, '']]
  # Phase 2 of the two-step Firehose rollout — see FirehoseStreamEnabled. The
  # role, bucket and log group come up in phase 1 under IsFirehoseDelivery; only
  # the resources that touch OpenSearch wait for this.
  CreateFirehoseStream: !And
    - !Equals [!Ref DeliveryMode, 'Firehose']
    - !Equals [!Ref FirehoseStreamEnabled, 'true']

  # The two rules are mutually exclusive by construction, so no event can be
  # indexed twice, and both disappear when the tenant owns the rule itself.
  CreateLambdaRule: !And
    - !Equals [!Ref DeliveryMode, 'Lambda']
    - !Equals [!Ref CreateForwardingRule, 'true']

  CreateFirehoseRule: !And
    - !Equals [!Ref DeliveryMode, 'Firehose']
    - !Equals [!Ref FirehoseStreamEnabled, 'true']
    - !Equals [!Ref CreateForwardingRule, 'true']

Globals:
  Function:
    # This app's dependencies include compiled extensions (pydantic-core, via
    # aws-lambda-powertools[all]), which are built per Python version. samconfig
    # sets use_container so the build always matches this runtime rather than
    # whatever interpreter happens to be on PATH — a mismatch ImportErrors at
    # cold start, not at build time.
    Runtime: python3.13
    Tracing: Active
    MemorySize: 1024
    Timeout: 60

Resources:
  # ---------------------------------------------------------------------------
  # 1. The event bus — created here, or attached to.
  #
  # Created only when EventBusName is blank. When a bus name is supplied this
  # stack declares nothing and every rule below simply names it, because two IaC
  # tools owning one bus means a CloudFormation rollback or stack delete can
  # destroy a resource the other tool believes it manages. That is not
  # hypothetical: one deployment moved bus ownership to Terraform by
  # retain-then-import precisely so the physical bus was never recreated and its
  # ARN never changed.
  #
  # `BusName` below is the single expression every other resource uses, so the
  # two cases stay indistinguishable downstream.
  # ---------------------------------------------------------------------------
  PlatformEventBus:
    Type: AWS::Events::EventBus
    Condition: CreateEventBus
    Properties:
      Name: !Sub '${NamePrefix}-events-${EnvironmentName}'

  # ---------------------------------------------------------------------------
  # 2. Error alerting: EventBridge rule -> SQS (buffer) -> digest Lambda -> SNS.
  #
  # Sections 2-4 exist only under CreateErrorAlerting=true (the default). With
  # it false none of them is created, and the alarms in section 6 keep their
  # state but lose their actions, since the topic they notify is gone.
  # ---------------------------------------------------------------------------
  ErrorAlertsRule:
    Type: AWS::Events::Rule
    Condition: CreateErrorAlertingResources
    Properties:
      Name: !Sub '${NamePrefix}-error-alerts-${EnvironmentName}'
      Description: Route error events to SQS for throttled digest alerts.
      EventBusName: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]
      EventPattern:
        detail-type:
          - Error
          - ProcessingError
          - IntegrationError
      State: ENABLED
      Targets:
        - Arn: !GetAtt ErrorAlertsQueue.Arn
          Id: !Sub '${NamePrefix}-error-alerts-queue-${EnvironmentName}'

  ErrorAlertsQueue:
    Type: AWS::SQS::Queue
    Condition: CreateErrorAlertingResources
    Properties:
      QueueName: !Sub '${NamePrefix}-${EnvironmentName}-error-alerts-queue'
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ErrorAlertsDLQ.Arn
        maxReceiveCount: 3

  ErrorAlertsDLQ:
    Type: AWS::SQS::Queue
    Condition: CreateErrorAlertingResources
    Properties:
      QueueName: !Sub '${NamePrefix}-${EnvironmentName}-error-alerts-dlq'
      MessageRetentionPeriod: 1209600

  ErrorAlertsQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: CreateErrorAlertingResources
    Properties:
      Queues:
        - !Ref ErrorAlertsQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ErrorAlertsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt ErrorAlertsRule.Arn

  # ---------------------------------------------------------------------------
  # 3. SNS alerts topic (subscribe email / Slack / PagerDuty).
  # ---------------------------------------------------------------------------
  AlertsSnsTopic:
    Type: AWS::SNS::Topic
    Condition: CreateErrorAlertingResources
    Properties:
      TopicName: !Sub '${NamePrefix}-alerts-${EnvironmentName}'
      DisplayName: Platform Alerts

  AlertsSnsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: CreateErrorAlertingResources
    Properties:
      Topics:
        - !Ref AlertsSnsTopic
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsSnsTopic

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: CreateAlertEmailSubscription
    Properties:
      TopicArn: !Ref AlertsSnsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # ---------------------------------------------------------------------------
  # 4. Alert digest Lambda: batches SQS error events into one SNS notification.
  #    ReservedConcurrentExecutions=1 + 60s batch window => <= 1 email/minute.
  # ---------------------------------------------------------------------------
  AlertDigestFunction:
    Type: AWS::Serverless::Function
    Condition: CreateErrorAlertingResources
    Properties:
      FunctionName: !Sub '${NamePrefix}-alert-digest-${EnvironmentName}'
      Description: Sends a throttled SNS digest of error events buffered in SQS.
      CodeUri: app/
      Handler: src.alert_digest.lambda_handler
      # Omitted entirely at 0 — AWS::NoValue rather than a literal 0, because
      # reserving 0 means "this function may never run", which is not what a
      # small Region quota is asking for.
      ReservedConcurrentExecutions: !If
        - ReserveDigestConcurrency
        - !Ref DigestReservedConcurrency
        - !Ref 'AWS::NoValue'
      Environment:
        Variables:
          ALERTS_SNS_TOPIC_ARN: !Ref AlertsSnsTopic
          ENVIRONMENT_NAME: !Ref EnvironmentName
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertsSnsTopic.TopicName
      Events:
        ErrorQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt ErrorAlertsQueue.Arn
            BatchSize: 100
            MaximumBatchingWindowInSeconds: 60

  AlertDigestLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateErrorAlertingResources
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NamePrefix}-alert-digest-${EnvironmentName}'
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # 5. OpenSearch forwarder: gets every event on the bus into OpenSearch.
  #
  # One function, two jobs, chosen by DeliveryMode:
  #
  #   Lambda   -> rule invokes it per event; it indexes the document itself
  #               (handler: src.handler.lambda_handler)
  #   Firehose -> Firehose invokes it per BATCH as a transformation; it only
  #               shapes documents and Firehose does the indexing
  #               (handler: src.handler.firehose_transform)
  #
  # The es:ESHttp* grant below stays in both modes even though the transform
  # never calls OpenSearch. It is what makes DeliveryMode reversible: revert the
  # parameter and the Lambda path works again without a permissions change. The
  # actions are identical to the ones the Firehose delivery role needs anyway.
  # ---------------------------------------------------------------------------
  # Only when ForwarderRoleName is set. SAM's `Policies` are ignored once an
  # explicit `Role` is supplied, so the permissions live here instead — the same
  # OpenSearch access, plus the basic execution and X-Ray permissions SAM would
  # otherwise have attached.
  ForwarderNamedRole:
    Type: AWS::IAM::Role
    Condition: HasForwarderRoleName
    Properties:
      RoleName: !Ref ForwarderRoleName
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AWSXRayDaemonWriteAccess'
      Policies:
        - PolicyName: opensearch-write
          PolicyDocument: !If
            - IsManagedDomain
            - Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [es:ESHttpGet, es:ESHttpHead, es:ESHttpPost, es:ESHttpPut,
                           es:ESHttpDelete, es:ESHttpPatch]
                  Resource: !Ref OpenSearchResourceArn
            - Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: aoss:APIAccessAll
                  Resource: !Ref OpenSearchResourceArn

  OpenSearchForwarderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${NamePrefix}-opensearch-forwarder-${EnvironmentName}'
      Description: !If
        - IsFirehoseDelivery
        - Shapes batches of EventBridge events for Firehose to bulk-index into OpenSearch.
        - Forwards EventBridge events to OpenSearch for search and analytics.
      CodeUri: app/
      # ONE handler, whatever DeliveryMode says. `lambda_handler` sniffs the
      # payload — `deliveryStreamArn` + `records` together appear in nothing
      # EventBridge sends — and dispatches to the per-event or per-batch path.
      #
      # Selecting the Handler from DeliveryMode instead looks tidier and loses
      # events. Where the rule lives in another stack (CreateForwardingRule=false)
      # the two deploy separately, so either order leaves a window in which the
      # rule still invokes per-event while the Handler already expects Firehose
      # records; everything arriving in that window raises, exhausts the rule's
      # retries and is gone. One entry point has no such window, and makes the
      # two stacks order-independent.
      Handler: src.handler.lambda_handler
      # SAM treats Role and Policies as mutually exclusive, so exactly one of
      # them is present: a pinned name means the role above, carrying the same
      # permissions; a blank one means SAM generates the role from Policies.
      Role: !If [HasForwarderRoleName, !GetAtt ForwarderNamedRole.Arn, !Ref 'AWS::NoValue']
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          OPENSEARCH_REGION: !If [HasRegionOverride, !Ref OpenSearchRegion, !Ref 'AWS::Region']
          OPENSEARCH_INDEX: !Ref OpenSearchIndex
          OPENSEARCH_SERVICE: !Ref OpenSearchServiceName
          SHAPING_CONFIG: !Ref ShapingConfig
          APP_ENV: !Ref EnvironmentName
          POWERTOOLS_SERVICE_NAME: !Sub '${NamePrefix}-forwarder'
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        - !If
          - IsManagedDomain
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                  - es:ESHttpPut
                  - es:ESHttpDelete
                  - es:ESHttpPatch
                Resource: !Ref OpenSearchResourceArn
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !Ref OpenSearchResourceArn

  # The per-event rule, declared by hand rather than through SAM's `Events`
  # shorthand: that shorthand cannot be wrapped in Fn::If, and this rule must
  # not exist in Firehose mode or every event would be indexed twice — once by
  # this rule and once through the stream. These are the same two resources SAM
  # generated before, with a deterministic name instead of a hashed one.
  AllPlatformEventsToForwarderRule:
    Type: AWS::Events::Rule
    Condition: CreateLambdaRule
    Properties:
      Name: !Sub '${NamePrefix}-opensearch-forwarder-${EnvironmentName}'
      Description: Route every event on the bus to the forwarder Lambda.
      EventBusName: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]
      EventPattern:
        account:
          - !Ref 'AWS::AccountId'
      State: ENABLED
      Targets:
        - Arn: !GetAtt OpenSearchForwarderFunction.Arn
          Id: !Sub '${NamePrefix}-opensearch-forwarder-${EnvironmentName}'

  ForwarderInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateLambdaRule
    Properties:
      FunctionName: !GetAtt OpenSearchForwarderFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt AllPlatformEventsToForwarderRule.Arn

  OpenSearchForwarderLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NamePrefix}-opensearch-forwarder-${EnvironmentName}'
      RetentionInDays: 30

  # ---------------------------------------------------------------------------
  # 5b. Firehose delivery path (DeliveryMode=Firehose only).
  #
  #   bus --rule--> Firehose stream --transform--> forwarder Lambda
  #                       |                              |
  #                       +--- bulk index ---> OpenSearch (cross-account OK)
  #                       +--- FailedDocumentsOnly ---> S3
  #
  # Cross-account note, and the reason ClusterEndpoint is used below rather than
  # DomainARN: Firehose resolves DomainARN inside the stream's own account. When
  # the domain lives in another account it cannot be named that way, and AWS
  # requires ClusterEndpoint instead. That also means the domain's own access
  # policy, in the owning account, must name FirehoseDeliveryRole as a principal
  # -- see the FirehoseDeliveryRoleArn output.
  # ---------------------------------------------------------------------------
  FailedDocumentBucket:
    Type: AWS::S3::Bucket
    Condition: IsFirehoseDelivery
    # Retained on stack delete: these are events OpenSearch rejected, which is
    # exactly the data you want to still have after a bad deploy is rolled back.
    #
    # The cost of that: Retain also applies to a rollback of the deploy that
    # FIRST created the bucket, so a failed initial deploy leaves the (empty)
    # bucket behind as DELETE_SKIPPED. The next attempt then fails early with
    # AWS::EarlyValidation::ResourceExistenceCheck, because the bucket already
    # exists and is no longer stack-managed. Delete the empty bucket by hand and
    # redeploy. Keeping the data is worth the one-time cleanup; losing rejected
    # documents to an unrelated rollback would not be.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${NamePrefix}-events-failed-${EnvironmentName}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      LifecycleConfiguration:
        Rules:
          - Id: ExpireFailedDocuments
            Status: Enabled
            ExpirationInDays: !Ref FailedDocumentRetentionDays
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  FirehoseLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsFirehoseDelivery
    Properties:
      LogGroupName: !Sub '/aws/kinesisfirehose/${NamePrefix}-events-${EnvironmentName}'
      RetentionInDays: 30

  # Firehose writes its own delivery errors here. Without these two streams the
  # CloudWatchLoggingOptions below silently log nothing, and a rejected bulk
  # request leaves no explanation anywhere.
  FirehoseOpenSearchLogStream:
    Type: AWS::Logs::LogStream
    Condition: IsFirehoseDelivery
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: OpenSearchDelivery

  FirehoseS3LogStream:
    Type: AWS::Logs::LogStream
    Condition: IsFirehoseDelivery
    Properties:
      LogGroupName: !Ref FirehoseLogGroup
      LogStreamName: S3Delivery

  FirehoseDeliveryRole:
    Type: AWS::IAM::Role
    Condition: IsFirehoseDelivery
    Properties:
      RoleName: !Sub '${NamePrefix}-firehose-delivery-${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
            # Confused-deputy guard: without it any Firehose stream in any
            # account could ask to assume this role.
            Condition:
              StringEquals:
                sts:ExternalId: !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: !Sub '${NamePrefix}-firehose-delivery-${EnvironmentName}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Index the documents. Firehose also probes the cluster before
              # delivering, which is why the read verbs are here too.
              - Sid: OpenSearchDelivery
                Effect: Allow
                Action:
                  - es:ESHttpGet
                  - es:ESHttpHead
                  - es:ESHttpPost
                  - es:ESHttpPut
                Resource:
                  - !Ref OpenSearchResourceArn
              - Sid: OpenSearchDescribe
                Effect: Allow
                Action:
                  - es:DescribeDomain
                  - es:DescribeDomains
                  - es:DescribeDomainConfig
                Resource:
                  - !Ref OpenSearchResourceArn
              - Sid: FailedDocumentBackup
                Effect: Allow
                Action:
                  - s3:AbortMultipartUpload
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:PutObject
                Resource:
                  - !GetAtt FailedDocumentBucket.Arn
                  - !Sub '${FailedDocumentBucket.Arn}/*'
              - Sid: InvokeTransform
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !GetAtt OpenSearchForwarderFunction.Arn
                  - !Sub '${OpenSearchForwarderFunction.Arn}:*'
              - Sid: DeliveryLogging
                Effect: Allow
                Action: logs:PutLogEvents
                Resource:
                  - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/kinesisfirehose/${NamePrefix}-events-${EnvironmentName}:log-stream:*'

  EventDeliveryStream:
    Type: AWS::KinesisFirehose::DeliveryStream
    Condition: CreateFirehoseStream
    Properties:
      DeliveryStreamName: !Sub '${NamePrefix}-events-${EnvironmentName}'
      DeliveryStreamType: DirectPut
      AmazonopensearchserviceDestinationConfiguration:
        RoleARN: !GetAtt FirehoseDeliveryRole.Arn
        # Not DomainARN — see the cross-account note above. The parameter is a
        # bare hostname; ClusterEndpoint must carry the scheme.
        ClusterEndpoint: !Sub 'https://${OpenSearchEndpoint}'
        IndexName: !Ref OpenSearchIndex
        IndexRotationPeriod: !Ref FirehoseIndexRotationPeriod
        BufferingHints:
          SizeInMBs: !Ref FirehoseBufferSizeMBs
          IntervalInSeconds: !Ref FirehoseBufferIntervalSeconds
        RetryOptions:
          DurationInSeconds: 300
        # FIREHOSE_DEFAULT makes the document id stable across delivery
        # attempts, so a retried batch overwrites its documents instead of
        # duplicating them. NO_DOCUMENT_ID indexes faster but every retry
        # re-inserts, which is how you end up counting the same event twice.
        DocumentIdOptions:
          DefaultDocumentIdFormat: FIREHOSE_DEFAULT
        S3BackupMode: FailedDocumentsOnly
        ProcessingConfiguration:
          Enabled: true
          Processors:
            - Type: Lambda
              Parameters:
                - ParameterName: LambdaArn
                  ParameterValue: !GetAtt OpenSearchForwarderFunction.Arn
                - ParameterName: NumberOfRetries
                  ParameterValue: '3'
                # The processing buffer, which Firehose otherwise defaults to
                # 60s regardless of the delivery BufferingHints below. Left at
                # the default it becomes the floor on latency and makes lowering
                # the delivery interval look like it did nothing.
                # Sub, not Ref: ParameterValue is typed String.
                - ParameterName: BufferIntervalInSeconds
                  ParameterValue: !Sub '${FirehoseBufferIntervalSeconds}'
                # Left at Firehose's 1MB default deliberately. A transformation
                # response is capped at 6MB, and the shaped documents come back
                # roughly the same size as the envelopes going in, so a bigger
                # processing batch risks tripping that cap.
                - ParameterName: BufferSizeInMBs
                  ParameterValue: '1'
        S3Configuration:
          RoleARN: !GetAtt FirehoseDeliveryRole.Arn
          BucketARN: !GetAtt FailedDocumentBucket.Arn
          Prefix: !Sub 'failed/${EnvironmentName}/'
          ErrorOutputPrefix: !Sub 'errors/${EnvironmentName}/'
          CompressionFormat: GZIP
          BufferingHints:
            SizeInMBs: 5
            IntervalInSeconds: 300
          CloudWatchLoggingOptions:
            Enabled: true
            LogGroupName: !Ref FirehoseLogGroup
            LogStreamName: S3Delivery
        CloudWatchLoggingOptions:
          Enabled: true
          LogGroupName: !Ref FirehoseLogGroup
          LogStreamName: OpenSearchDelivery

  # EventBridge needs its own role to put records into the stream; unlike SQS or
  # Lambda targets there is no resource policy to attach on the Firehose side.
  EventsToFirehoseRole:
    Type: AWS::IAM::Role
    Condition: CreateFirehoseStream
    Properties:
      RoleName: !Sub '${NamePrefix}-events-to-firehose-${EnvironmentName}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
            # Scoped to the account rather than the rule ARN on purpose: naming
            # the rule here would make the rule depend on the role and the role
            # depend on the rule.
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref 'AWS::AccountId'
      Policies:
        - PolicyName: !Sub '${NamePrefix}-events-to-firehose-${EnvironmentName}'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - firehose:PutRecord
                  - firehose:PutRecordBatch
                Resource: !GetAtt EventDeliveryStream.Arn

  # Events EventBridge could not hand to Firehose at all (throttling, stream
  # deleted, permissions). This is the ingress-side counterpart to the S3
  # failed-document backup, which only catches documents OpenSearch rejected.
  EventDeliveryDlq:
    Type: AWS::SQS::Queue
    Condition: CreateFirehoseStream
    Properties:
      QueueName: !Sub '${NamePrefix}-${EnvironmentName}-event-delivery-dlq'
      MessageRetentionPeriod: 1209600

  EventDeliveryDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Condition: CreateFirehoseStream
    Properties:
      Queues:
        - !Ref EventDeliveryDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt EventDeliveryDlq.Arn
            # Scoped to our own rule when we own it, and to this account's rules
            # when the tenant owns it — a GetAtt to a rule that may not exist
            # cannot be used here, and leaving the condition off entirely would
            # let any EventBridge rule in any account write to this queue.
            Condition: !If
              - CreateFirehoseRule
              - ArnEquals:
                  aws:SourceArn: !GetAtt AllPlatformEventsToFirehoseRule.Arn
              - StringEquals:
                  aws:SourceAccount: !Ref 'AWS::AccountId'

  AllPlatformEventsToFirehoseRule:
    Type: AWS::Events::Rule
    Condition: CreateFirehoseRule
    Properties:
      Name: !Sub '${NamePrefix}-opensearch-delivery-${EnvironmentName}'
      Description: Route every event on the bus to Firehose for bulk indexing into OpenSearch.
      EventBusName: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]
      EventPattern:
        account:
          - !Ref 'AWS::AccountId'
      State: ENABLED
      Targets:
        - Arn: !GetAtt EventDeliveryStream.Arn
          Id: !Sub '${NamePrefix}-opensearch-delivery-${EnvironmentName}'
          RoleArn: !GetAtt EventsToFirehoseRole.Arn
          RetryPolicy:
            MaximumRetryAttempts: 20
            MaximumEventAgeInSeconds: 3600
          DeadLetterConfig:
            Arn: !GetAtt EventDeliveryDlq.Arn

  # ---------------------------------------------------------------------------
  # 6. CloudWatch alarms — bus health + forwarder guardrails.
  # ---------------------------------------------------------------------------
  EventBusFailedInvocationsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-EventBus-FailedInvocations-${EnvironmentName}'
      AlarmDescription: EventBridge failed invocations exceeds threshold.
      Namespace: AWS/Events
      MetricName: FailedInvocations
      Dimensions:
        - Name: EventBusName
          Value: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 50
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'
      OKActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  EventBusThrottledRulesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-EventBus-ThrottledRules-${EnvironmentName}'
      AlarmDescription: EventBridge rules being throttled.
      Namespace: AWS/Events
      MetricName: ThrottledRules
      Dimensions:
        - Name: EventBusName
          Value: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'
      OKActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  ErrorAlertsDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateErrorAlertingResources
    Properties:
      AlarmName: !Sub '${NamePrefix}-ErrorAlerts-DLQ-Depth-${EnvironmentName}'
      AlarmDescription: Error alerts DLQ has messages — processing failures.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ErrorAlertsDLQ.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsSnsTopic

  ForwarderInvocationSpikeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-Forwarder-InvocationSpike-${EnvironmentName}'
      # The threshold counts INVOCATIONS, not events, so it means something
      # different per mode. In Lambda mode it is one invocation per event, so
      # 10K/5min is 10K events. In Firehose mode one invocation carries a whole
      # buffered batch, so the same 10K would be a runaway of a completely
      # different magnitude — treat a breach here as far more serious, and use
      # the Firehose Records/DataFreshness metrics for event-rate questions.
      AlarmDescription: !If
        - IsFirehoseDelivery
        - Forwarder transformation invocations exceed 10K in 5 minutes — each carries a full batch.
        - Forwarder invocations exceed 10K in 5 minutes — potential runaway.
      Namespace: AWS/Lambda
      MetricName: Invocations
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: !Ref OpenSearchForwarderFunction
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  ForwarderErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-Forwarder-HighErrors-${EnvironmentName}'
      AlarmDescription: Forwarder error count exceeds threshold.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Dimensions:
        - Name: FunctionName
          Value: !Ref OpenSearchForwarderFunction
      Period: 300
      EvaluationPeriods: 3
      Threshold: 100
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  ForwarderDurationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${NamePrefix}-Forwarder-HighDuration-${EnvironmentName}'
      AlarmDescription: Forwarder p99 duration exceeds 48s (80% of 60s timeout).
      Namespace: AWS/Lambda
      MetricName: Duration
      ExtendedStatistic: p99
      Dimensions:
        - Name: FunctionName
          Value: !Ref OpenSearchForwarderFunction
      Period: 300
      EvaluationPeriods: 3
      Threshold: 48000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  # --- Firehose delivery alarms (DeliveryMode=Firehose only) ---------------
  #
  # These replace what the Lambda path could never alarm on. A forwarder that
  # swallowed its OpenSearch errors reported zero Lambda Errors while dropping
  # every event; DeliveryToAmazonOpenSearchService.Success is measured by
  # Firehose, not by our code, so it cannot be masked that way.
  FirehoseDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateFirehoseStream
    Properties:
      AlarmName: !Sub '${NamePrefix}-Firehose-DeliveryFailures-${EnvironmentName}'
      AlarmDescription: >
        Firehose is failing to index documents into OpenSearch. Success is the
        fraction of delivery attempts that landed, so anything below 1 means
        documents are going to the failed-document S3 prefix instead.
      Namespace: AWS/Firehose
      MetricName: DeliveryToAmazonOpenSearchService.Success
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref EventDeliveryStream
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'
      OKActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  FirehoseDataFreshnessAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateFirehoseStream
    Properties:
      AlarmName: !Sub '${NamePrefix}-Firehose-DataFreshness-${EnvironmentName}'
      AlarmDescription: >
        Oldest undelivered record in the stream exceeds 15 minutes — delivery is
        backing up. Catches a stalled stream, which the Success metric does not:
        a stream delivering nothing at all reports no failures.
      Namespace: AWS/Firehose
      MetricName: DeliveryToAmazonOpenSearchService.DataFreshness
      Dimensions:
        - Name: DeliveryStreamName
          Value: !Ref EventDeliveryStream
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 900
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'
      OKActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  EventDeliveryDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateFirehoseStream
    Properties:
      AlarmName: !Sub '${NamePrefix}-EventDelivery-DLQ-Depth-${EnvironmentName}'
      AlarmDescription: EventBridge could not hand events to Firehose — check the delivery DLQ.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt EventDeliveryDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - CreateErrorAlertingResources
        - [!Ref AlertsSnsTopic]
        - !Ref 'AWS::NoValue'

  # ---------------------------------------------------------------------------
  # 7. Search API (CreateSearchApi=true) — read side over the same index.
  #
  # Absent entirely when not asked for. The forwarder writes and this reads;
  # they share a repository and an index and nothing else, which is why the API
  # can be bolted on or left off without touching the delivery path at all.
  # ---------------------------------------------------------------------------
  SearchApi:
    Type: AWS::ApiGatewayV2::Api
    Condition: CreateSearchApiResources
    Properties:
      Name: !Sub '${NamePrefix}-events-api-${EnvironmentName}'
      Description: Search the application-event archive.
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: ['*']
        AllowMethods: [GET, POST, OPTIONS]

  SearchApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Condition: CreateSearchApiResources
    Properties:
      ApiId: !Ref SearchApi
      # $default, so the stage name never appears in the path. A custom domain
      # mapped at a base path is then the only thing shaping the URL.
      StageName: $default
      AutoDeploy: true

  SearchApiAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Condition: HasSearchApiAuthorizer
    Properties:
      ApiId: !Ref SearchApi
      Name: !Sub '${NamePrefix}-events-api-authorizer-${EnvironmentName}'
      AuthorizerType: REQUEST
      AuthorizerPayloadFormatVersion: '2.0'
      # Simple responses: the authorizer returns {"isAuthorized": true|false}
      # rather than an IAM policy document.
      EnableSimpleResponses: true
      IdentitySource: ['$request.header.Authorization']
      AuthorizerUri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SearchApiAuthorizerArn}/invocations'

  SearchApiAuthorizerPermission:
    Type: AWS::Lambda::Permission
    Condition: HasSearchApiAuthorizer
    Properties:
      FunctionName: !Ref SearchApiAuthorizerArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SearchApi}/authorizers/${SearchApiAuthorizer}'

  SearchApiFunction:
    Type: AWS::Serverless::Function
    Condition: CreateSearchApiResources
    Properties:
      FunctionName: !Sub '${NamePrefix}-events-api-${EnvironmentName}'
      Description: Search the application-event archive in OpenSearch.
      CodeUri: app/
      Handler: src.api.lambda_handler
      MemorySize: 512
      Timeout: 29  # API Gateway gives up at 29s; a longer timeout cannot be observed
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !Ref OpenSearchEndpoint
          OPENSEARCH_REGION: !If [HasRegionOverride, !Ref OpenSearchRegion, !Ref 'AWS::Region']
          OPENSEARCH_INDEX: !Ref OpenSearchIndex
          OPENSEARCH_SERVICE: !Ref OpenSearchServiceName
          ENABLE_EMIT_ENDPOINT: !Ref EnableEmitEndpoint
          EVENT_BUS_NAME: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]
          POWERTOOLS_SERVICE_NAME: !Sub '${NamePrefix}-events-api'
          POWERTOOLS_LOG_LEVEL: INFO
      Policies:
        # Read-only on the index. The API must not be able to write the archive
        # it serves — /emit publishes to the bus and lets the forwarder decide.
        - !If
          - IsManagedDomain
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpHead, es:ESHttpPost]
                Resource: !Ref OpenSearchResourceArn
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: aoss:APIAccessAll
                Resource: !Ref OpenSearchResourceArn
        - !If
          - IsEmitEnabled
          - Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: events:PutEvents
                Resource: !Sub
                  - 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Bus}'
                  - Bus: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]
          - !Ref 'AWS::NoValue'

  SearchApiLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateSearchApiResources
    Properties:
      LogGroupName: !Sub '/aws/lambda/${NamePrefix}-events-api-${EnvironmentName}'
      RetentionInDays: 30

  # One proxy route rather than a route per path: the handler already owns its
  # routing, and a route list here would be a second place to update every time
  # one is added.
  SearchApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Condition: CreateSearchApiResources
    Properties:
      ApiId: !Ref SearchApi
      RouteKey: 'ANY /{proxy+}'
      AuthorizationType: !If [HasSearchApiAuthorizer, CUSTOM, NONE]
      AuthorizerId: !If [HasSearchApiAuthorizer, !Ref SearchApiAuthorizer, !Ref 'AWS::NoValue']
      Target: !Sub 'integrations/${SearchApiIntegration}'

  SearchApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Condition: CreateSearchApiResources
    Properties:
      ApiId: !Ref SearchApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SearchApiFunction.Arn
      PayloadFormatVersion: '2.0'

  SearchApiInvokePermission:
    Type: AWS::Lambda::Permission
    Condition: CreateSearchApiResources
    Properties:
      FunctionName: !GetAtt SearchApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SearchApi}/*'

Outputs:
  EventBusName:
    Description: Name of the platform event bus — publish your events here.
    Value: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]

  EventBusArn:
    Description: ARN of the platform event bus.
    Value: !Sub
      - 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:event-bus/${Bus}'
      - Bus: !If [CreateEventBus, !Sub '${NamePrefix}-events-${EnvironmentName}', !Ref EventBusName]

  AlertsSnsTopicArn:
    Condition: CreateErrorAlertingResources
    Description: SNS topic ARN for alerts — subscribe email / Slack / PagerDuty.
    Value: !Ref AlertsSnsTopic

  ErrorAlertsQueueArn:
    Condition: CreateErrorAlertingResources
    Description: Error alerts SQS queue ARN.
    Value: !GetAtt ErrorAlertsQueue.Arn

  ForwarderFunctionArn:
    Description: OpenSearch forwarder Lambda ARN.
    Value: !GetAtt OpenSearchForwarderFunction.Arn

  ForwarderRoleArn:
    Description: >
      Forwarder execution role ARN — the principal a cross-account domain must
      name under DeliveryMode=Lambda, and the one to add to a data access policy
      for OpenSearch Serverless. Under DeliveryMode=Firehose the writer is
      FirehoseDeliveryRoleArn instead, not this.
    Value: !If
      - HasForwarderRoleName
      - !GetAtt ForwarderNamedRole.Arn
      - !GetAtt OpenSearchForwarderFunctionRole.Arn

  DeliveryStreamName:
    Condition: CreateFirehoseStream
    Description: Firehose stream the bus delivers events through.
    Value: !Ref EventDeliveryStream

  # The three outputs below exist for CreateForwardingRule=false: everything a
  # rule in another stack needs to target this pipeline itself.
  DeliveryStreamArn:
    Condition: CreateFirehoseStream
    Description: >
      Point your own EventBridge rule here when this stack does not own the rule.
      Pair it with EventsToFirehoseRoleArn as the target's RoleArn.
    Value: !GetAtt EventDeliveryStream.Arn

  EventsToFirehoseRoleArn:
    Condition: CreateFirehoseStream
    Description: >
      The role EventBridge assumes to put records into the stream. A Firehose
      target has no resource policy, so the rule must carry this RoleArn — unlike
      a Lambda target, which uses the invoke permission instead.
    Value: !GetAtt EventsToFirehoseRole.Arn

  EventDeliveryDlqArn:
    Condition: CreateFirehoseStream
    Description: >
      Dead-letter queue for events EventBridge could never hand to Firehose. Set
      it as your rule's DeadLetterConfig; it is not the same thing as the
      failed-document bucket, which catches documents OpenSearch rejected.
    Value: !GetAtt EventDeliveryDlq.Arn

  FirehoseDeliveryRoleArn:
    Condition: IsFirehoseDelivery
    Description: >
      THE role that must be allowed to write to your OpenSearch domain. Firehose
      signs every bulk request as this role, not as the forwarder's execution
      role — so for a cross-account domain, add this ARN as a principal on the
      domain's access policy in the account that owns the domain. Until you do,
      every document lands in the failed-document bucket with a 403.
    Value: !GetAtt FirehoseDeliveryRole.Arn

  SearchApiEndpoint:
    Condition: CreateSearchApiResources
    Description: >
      Base URL of the search API. No custom domain is created — map your own to
      this API if you want a stable hostname.
    Value: !Sub 'https://${SearchApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'

  SearchApiId:
    Condition: CreateSearchApiResources
    Description: API id, for an ApiMapping onto your own custom domain.
    Value: !Ref SearchApi

  FailedDocumentBucketName:
    Condition: IsFirehoseDelivery
    Description: >
      Bucket holding documents OpenSearch rejected, under failed/<env>/.
      Retained on stack delete.
    Value: !Ref FailedDocumentBucket
